name: Boletín Oficial CABA

on:
  schedule:
    # Lunes a viernes, 4 intentos (hora Argentina = UTC-3):
    # 08:30, 10:30, 13:00 y 17:00. El primero que encuentra el boletín nuevo
    # lo procesa; los demás no hacen nada.
    - cron: "30 11 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "0 20 * * 1-5"
  workflow_dispatch:   # botón "Run workflow" para correrlo a mano
    inputs:
      desde:
        description: "Carga histórica: N° de boletín inicial (7275 = 02/01/2026). Vacío = corrida normal"
        required: false
        default: ""
      historico:
        description: "Mandar también el Excel histórico completo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  boletin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Revisar boletín y enviar resumen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DESDE: ${{ github.event.inputs.desde }}
          HISTORICO: ${{ github.event.inputs.historico }}
          PYTHONUNBUFFERED: "1"   # para ver el avance en vivo en el log
        run: python boletin_bot.py

      - name: Guardar base histórica en el repo
        run: |
          if [ ! -d data ]; then echo "Todavía no hay datos."; exit 0; fi
          git config user.name "boletin-bot"
          git config user.email "boletin-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Boletín $(python -c "import json;print(json.load(open('data/estado.json'))['ultimo_numero'])")"
            git pull --rebase   # por si el repo cambió mientras corría
            git push
          fi

      - name: Excel como artefacto descargable
        if: hashFiles('salida/*.xlsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: boletin_caba_historico
          path: salida/boletin_caba_historico.xlsx
          retention-days: 30
